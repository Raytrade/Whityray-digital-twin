<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0d"><title>Sesen Mind — Immortal Beast</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090b0d;color:#e9eceb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#17302d 0,transparent 40%),#090b0d}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}.eyebrow{letter-spacing:.22em;color:#83b9a6;font-size:11px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{border:1px solid #35584d;border-radius:30px;padding:7px 11px;color:#a8cdbf;font-size:11px}h1{font-size:clamp(32px,8vw,54px);margin:22px 0 6px;letter-spacing:-.05em}.sub{color:#9ca9a5;line-height:1.6}.panel{background:#101615;border:1px solid #263a34;border-radius:20px;padding:17px;margin-top:22px;box-shadow:0 18px 60px #0005}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode{background:#18211e;border:1px solid #34473f;color:#dce6e1;padding:13px 9px;border-radius:12px;font-weight:650}.mode.active{background:#24483c;border-color:#8ab9a3}.mode.break{grid-column:1/-1;border-color:#74513a}.mode small{display:block;font-weight:400;color:#a9b8b1;margin-top:4px}.label{display:block;color:#a8b6b0;font-size:12px;margin:17px 0 8px}textarea{width:100%;min-height:130px;resize:vertical;background:#090f0d;border:1px solid #31443c;border-radius:13px;padding:14px;color:#f0f4f1;font:inherit;line-height:1.5;outline:none}textarea:focus{border-color:#82b69f}.actions{display:flex;gap:10px;margin-top:12px}.go{flex:1;border:0;border-radius:12px;padding:14px;background:#a9d2bd;color:#102019;font-weight:800}.clear{border:1px solid #35463f;background:#18211e;color:#dbe6df;border-radius:12px;padding:14px}.out{white-space:pre-wrap;line-height:1.8;font-size:17px;min-height:45px}.questions{color:#a8cdbf;line-height:1.7}.foot{color:#718079;font-size:11px;text-align:center;margin-top:24px}@media(min-width:600px){.wrap{padding-top:48px}.modes{grid-template-columns:repeat(3,1fr)}.mode.break{grid-column:auto}}</style></head><body><main class="wrap"><div class="head"><div class="eyebrow">IMMORTAL BEAST / MIND ENGINE</div><div class="badge">SESEN MIND v2</div></div><h1>Hear the signal.</h1><div class="sub">No be teacher talk. No forced calm. Put the thought down; let the mind find the meaning.</div><section class="panel"><div class="eyebrow" style="margin-bottom:12px">CHOOSE YOUR CURRENT</div><div class="modes"><button class="mode active" data-mode="Sesen Street">STREET<small>Gbas Gbos · coded sense</small></button><button class="mode" data-mode="Sesen Worldwide">WORLDWIDE<small>Wider lens · mature truth</small></button><button class="mode break" data-mode="Break the Loop">BREAK THE LOOP<small>Catch the pattern · change the angle</small></button></div><label class="label" for="thought">Wetin dey your mind?</label><textarea id="thought" placeholder="Drop the thought as e be. No need package am..."></textarea><div class="actions"><button class="go" id="run">SENSE AM →</button><button class="clear" id="clear">CLEAR</button></div></section><section class="panel"><div class="eyebrow">THE REFLECTION</div><div class="out" id="output">The water no need shout before e show you the depth.</div><div class="questions" id="questions"></div></section><div class="foot">NO BE WIND FILTER · MUD FOOT CHECK · SILENCE GET MEANING</div></main><script>
let mode="Sesen Street";document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));}));const thought=document.getElementById("thought"),output=document.getElementById("output"),questions=document.getElementById("questions"),run=document.getElementById("run");document.getElementById("clear").onclick=()=>{thought.value="";output.textContent="The water no need shout before e show you the depth.";questions.textContent="";};run.onclick=async()=>{const message=thought.value.trim();if(!message){thought.focus();return;}run.disabled=true;run.textContent="SENSING…";output.textContent="";questions.textContent="";try{const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message,mode})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Signal no pass through.");output.textContent=data.answer||"No clear signal yet.";if(mode==="Break the Loop")questions.textContent="\n\nCHECK THE ANGLE\n1. Wetin I dey assume without proof?\n2. Which part na my responsibility, which part no be my own?\n3. Wetin be one small move wey fit change this pattern?";}catch(e){output.textContent=e.message||"Connection no clear. Try again.";}finally{run.disabled=false;run.textContent="SENSE AM →";}};</script></body></html>
